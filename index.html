  .woods::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,18,14,.66) 0%, rgba(10,18,14,.88) 100%);
  }

  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }

  /* ───────── HERO ───────── */
  .hero { position: relative; height: min(76vh, 560px); min-height: 440px; overflow: hidden; background: var(--bg); }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 28%;
    animation: settle 2.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,18,14,.42) 0%, rgba(10,18,14,0) 26%, rgba(10,18,14,.50) 64%, var(--bg) 100%);
  }
  @keyframes settle { from { transform: scale(1.10); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .hero-copy {
    position: absolute; z-index: 2; left: 22px; right: 22px;
    bottom: calc(92px);
  }
  .hero-line { font-size: 15px; font-weight: 500; color: rgba(237,231,211,.86); margin-bottom: 8px; min-height: 22px; }
  .hero h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(46px, 14vw, 64px); line-height: .98; letter-spacing: -0.02em;
    text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.45);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; min-height: 36px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 11px; border-radius: 999px;
    background: rgba(10,18,14,.58); border: 1px solid var(--line-strong);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 14px; font-weight: 500;
  }
  .chip .ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); }
  .chip.done .ring { background: var(--c); }
  .chip.wait { color: rgba(237,231,211,.82); }

  /* ───────── LOG CARD ───────── */
  .log {
    position: relative; z-index: 3; margin: -64px 14px 0;
    padding: 22px 18px 16px; border-radius: 28px;
    background: rgba(17,28,22,.95); border: 1px solid var(--line-strong);
    box-shadow: 0 30px 60px -24px rgba(0,0,0,.75), inset 0 1px 0 var(--who-soft);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .log h2, .sec-title, .card-head h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; }
  .log h2 { font-size: 24px; margin-bottom: 16px; }

  .who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .who-btn {
    height: 52px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--field);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 600; color: var(--muted); transition: background .18s, border-color .18s, color .18s;
  }
  .who-btn[data-who="you"]   { --pc: var(--josh);  --pc-soft: var(--josh-soft); }
  .who-btn[data-who="emily"] { --pc: var(--emily); --pc-soft: var(--emily-soft); }
  .who-btn .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--pc); }
  .who-btn[aria-pressed="true"] { border-color: var(--pc); background: var(--pc-soft); color: var(--text); }

  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 14px; }
  .field label, .field .lbl { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input[type="date"], input[type="number"], input[type="text"] {
    width: 100%; height: 52px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--line-strong); background: var(--field); color: var(--text);
    font-family: var(--sans); font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="date"] { display: block; text-align: left; min-height: 52px; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input:focus { border-color: var(--who); box-shadow: 0 0 0 3px var(--who-soft); }
  input::placeholder { color: #5D6B60; }

  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--field); border: 1px solid var(--line-strong); }
  .seg button { min-height: 44px; min-width: 52px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
  .seg.small button { min-height: 36px; min-width: 44px; padding: 0 12px; font-size: 13px; }

  .weight-wrap { position: relative; margin-bottom: 8px; }
  .weight-wrap input { height: 76px; padding: 0 60px 0 18px; font-family: var(--serif); font-size: 42px; font-weight: 500; letter-spacing: -0.01em; }
  .weight-wrap .suffix { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 17px; color: var(--muted); font-weight: 500; pointer-events: none; }

  .linkbtn { color: var(--muted); font-size: 14px; font-weight: 500; min-height: 44px; padding: 0 2px; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
  .linkbtn:hover { color: var(--text); }
  #note-input { height: 48px; font-size: 16px; margin-bottom: 8px; }

  .log-btn {
    width: 100%; height: 58px; margin-top: 6px; border-radius: 18px;
    background: var(--who); color: var(--ink); font-size: 17px; font-weight: 700;
    transition: transform .12s, opacity .15s, background .2s;
  }
  .log-btn:active { transform: scale(.98); }
  .log-btn:disabled { opacity: .55; cursor: not-allowed; }
  .sync { text-align: center; font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 18px; }
  .sync.live { color: var(--josh); }
  .sync.error { color: #E69078; }

  /* ───────── PROGRESS ───────── */
  .sec-title { font-size: 28px; margin: 44px 22px 14px; }
  .pcard {
    margin: 0 14px 12px; padding: 20px 20px 18px; border-radius: 24px;
    background: var(--card); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .ph { display: flex; align-items: center; gap: 10px; }
  .ph .dot { width: 11px; height: 11px; border-radius: 50%; }
  .ph h3 { font-size: 16px; font-weight: 600; flex: 1; }
  .streak { font-size: 13px; font-weight: 600; color: var(--pc); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); }
  .big { font-family: var(--serif); font-weight: 500; font-size: 60px; line-height: 1; letter-spacing: -0.02em; margin: 16px 0 8px; font-variant-numeric: lining-nums; }
  .big small { font-family: var(--sans); font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .delta { font-size: 14px; color: var(--muted); }
  .none { color: var(--muted); font-size: 15px; margin-top: 12px; }

  .goal { margin-top: 18px; }
  .bar { height: 8px; border-radius: 999px; background: rgba(237,231,211,.10); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--pc); transition: width .7s cubic-bezier(.2,.7,.2,1); }
  .goal-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; font-size: 14px; color: var(--muted); }
  .goal-row b { color: var(--text); font-weight: 600; }
  .goal .linkbtn { font-size: 14px; }

  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); }
  .mini dt { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .mini dd { font-family: var(--serif); font-size: 20px; font-weight: 500; }

  .ghost {
    display: block; width: calc(100% - 28px); margin: 4px 14px 0; height: 52px; border-radius: 16px;
    border: 1px solid var(--line-strong); font-size: 15px; font-weight: 600; transition: background .15s;
  }
  .ghost:hover { background: rgba(237,231,211,.06); }

  /* ───────── CHART + HISTORY CARDS ───────── */
  .card { margin: 44px 14px 0; padding: 20px 16px 14px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 0 4px; }
  .card-head h2 { font-size: 26px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 12px 4px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .canvas-wrap { position: relative; height: 290px; }
  .empty { color: var(--muted); font-size: 15px; padding: 26px 6px; text-align: center; }

  .hist-head, .hrow { display: grid; grid-template-columns: 62px 1fr 1fr; gap: 8px; }
  .hist-head { margin: 14px 4px 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .hist-head span { display: inline-flex; align-items: center; gap: 6px; }
  .hist-head i { width: 9px; height: 9px; border-radius: 50%; }
  .hrow { padding: 10px 4px; border-top: 1px solid var(--line); align-items: start; }
  .wk { font-family: var(--serif); font-size: 16px; padding-top: 8px; }
  .cell { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 12px; min-height: 44px; }
  .cell:hover { background: rgba(237,231,211,.06); }
  .cell + .cell { margin-top: 4px; }
  .cell .w { font-family: var(--serif); font-size: 19px; font-weight: 500; }
  .cell .w small { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 500; }
  .cell .d, .cell .n { display: block; font-size: 12.5px; color: var(--muted); }
  .cell .n { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gap { display: block; padding: 8px; font-size: 14px; color: var(--muted); }
  .gap.miss { color: #C9A25A; }
  .hist-foot { display: flex; justify-content: center; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 4px; }

  /* ───────── SHEETS (edit + goal) ───────── */
  dialog {
    margin: auto auto 0; width: min(520px, 100%); max-width: 100%;
    border: 0; border-radius: 26px 26px 0 0; background: var(--card-hi); color: var(--text);
    padding: 24px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(4,8,6,.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  dialog[open] { animation: sheet .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes sheet { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  dialog h3 { font-family: var(--serif); font-size: 24px; font-weight: 500; margin-bottom: 16px; }
  dialog .field { margin-bottom: 14px; }
  .actions { display: grid; gap: 10px; margin-top: 18px; }
  .btn { height: 52px; border-radius: 16px; font-weight: 700; font-size: 16px; }
  .btn.primary { background: var(--who); color: var(--ink); }
  .btn.quiet { border: 1px solid var(--line-strong); font-weight: 600; }
  .btn.danger { border: 1px solid rgba(230,144,120,.45); color: #E69078; font-weight: 600; }
  .btn.danger.confirm { background: #E69078; color: var(--ink); border-color: #E69078; }

  /* ───────── TOAST + DUCK CELEBRATION ───────── */
  .toast {
    position: fixed; z-index: 200; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translate(-50%, 120px); background: var(--text); color: var(--ink);
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
    transition: transform .3s cubic-bezier(.34,1.4,.64,1);
  }
  .toast.show { transform: translate(-50%, 0); }
  .celebrate {
    position: fixed; z-index: 210; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    width: min(92vw, 440px); transform: translate(-50%, 200px);
    display: flex; align-items: center; gap: 16px; padding: 14px 20px 14px 14px;
    background: var(--card-hi); border: 1px solid var(--emily); border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
    transition: transform .45s cubic-bezier(.34,1.3,.64,1);
  }
  .celebrate.show { transform: translate(-50%, 0); }
  .celebrate img { width: 62px; height: auto; flex-shrink: 0; }
  .celebrate.show img { animation: wiggle .9s .25s ease-in-out 2; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .celebrate b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; }
  .celebrate span { font-size: 14px; color: var(--muted); }

  @media (min-width: 700px) {
    .hero { margin-top: 0; }
    .app { box-shadow: 0 0 80px rgba(0,0,0,.55); background: rgba(10,18,14,.72); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero img, dialog[open], .celebrate.show img { animation: none; }
    .toast, .celebrate, .bar i { transition: none; }
  }
</style>
</head>

      <p class="hero-line" id="hero-line"></p>
      <h1>Our weight journey</h1>
      <div class="chips" id="chips" aria-live="polite"></div>
    </div>
  </header>

  <!-- LOG -->
  <section class="log" aria-labelledby="log-h">
    <h2 id="log-h">Log your weight</h2>

    <div class="who" role="group" aria-label="Who is weighing in">
      <button type="button" class="who-btn" data-who="you" aria-pressed="true"><span class="dot"></span>Josh</button>
      <button type="button" class="who-btn" data-who="emily" aria-pressed="false"><span class="dot"></span>Emily</button>
    </div>

    <div class="row2">
      <div class="field">
        <label for="date-input">Date</label>
        <input type="date" id="date-input">
      </div>
      <div class="field">
        <span class="lbl" id="unit-lbl">Unit</span>
        <div class="seg" role="group" aria-labelledby="unit-lbl">
          <button type="button" id="btn-kg" aria-pressed="true">kg</button>
          <button type="button" id="btn-lbs" aria-pressed="false">lbs</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="weight-input">Weight</label>
      <div class="weight-wrap">
        <input type="number" id="weight-input" placeholder="0.0" step="any" inputmode="decimal" autocomplete="off">
        <span class="suffix" id="weight-suffix">kg</span>
      </div>
    </div>

    <button type="button" class="linkbtn" id="note-toggle">Add a note</button>
    <input type="text" id="note-input" maxlength="80" placeholder="e.g. holiday week" aria-label="Note" hidden>

    <button type="button" class="log-btn" id="log-btn">Log weight</button>
    <p class="sync" id="sync-status" role="status">Connecting…</p>
  </section>

  <!-- PROGRESS -->
  <h2 class="sec-title">Progress</h2>
  <div id="stats"></div>
  <button type="button" class="ghost" id="share-btn">Copy summary for Discord</button>

  <!-- CHART -->
  <section class="card" aria-labelledby="chart-h">
    <div class="card-head">
      <h2 id="chart-h">Weight over time</h2>
      <div class="seg small" id="range" role="group" aria-label="Chart range">
        <button type="button" data-r="4" aria-pressed="false">4 wks</button>
        <button type="button" data-r="12" aria-pressed="true">12 wks</button>
        <button type="button" data-r="0" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--josh)"></i>Josh</span>
      <span><i style="background:var(--emily)"></i>Emily</span>
      <span>Dots are weigh-ins, lines are the 3-check-in trend, dashes are goals</span>
    </div>
    <div class="canvas-wrap" id="chart-wrap"><canvas id="weightChart"></canvas></div>
    <p class="empty" id="chart-empty" hidden>Log a weigh-in to start your chart.</p>
  </section>

  <!-- HISTORY -->
  <section class="card" aria-labelledby="hist-h">
    <div class="card-head"><h2 id="hist-h">History</h2></div>
    <div class="hist-head" id="hist-head">
      <span>Week of</span>
      <span><i style="background:var(--josh)"></i>Josh</span>
      <span><i style="background:var(--emily)"></i>Emily</span>
    </div>
    <div id="hist-rows"></div>
    <div class="hist-foot"><button type="button" class="linkbtn" id="hist-toggle" hidden></button></div>
  </section>

</main>

<!-- Edit entry -->
<dialog id="edit-dlg" aria-labelledby="edit-title">
  <h3 id="edit-title">Edit entry</h3>
  <div class="field"><label for="edit-date">Date</label><input type="date" id="edit-date"></div>
  <div class="field"><label for="edit-weight">Weight (<span id="edit-unit">kg</span>)</label><input type="number" id="edit-weight" step="any" inputmode="decimal"></div>
  <div class="field"><label for="edit-note">Note</label><input type="text" id="edit-note" maxlength="80" placeholder="Optional"></div>
  <div class="actions">
    <button type="button" class="btn primary" id="edit-save">Save changes</button>
    <button type="button" class="btn danger" id="edit-del">Delete entry</button>
    <button type="button" class="btn quiet" id="edit-cancel">Cancel</button>
  </div>
</dialog>

<!-- Goal -->
<dialog id="goal-dlg" aria-labelledby="goal-title">
  <h3 id="goal-title">Goal weight</h3>
  <div class="field"><label for="goal-input">Goal (<span id="goal-unit">kg</span>)</label><input type="number" id="goal-input" step="any" inputmode="decimal" placeholder="e.g. 90"></div>
  <div class="actions">
    <button type="button" class="btn primary" id="goal-save">Save goal</button>
    <button type="button" class="btn danger" id="goal-clear">Remove goal</button>
    <button type="button" class="btn quiet" id="goal-cancel">Cancel</button>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ─── FIREBASE (unchanged, same database as before) ───────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyB7n1ta9mctkO2r_POqAQQNWGs89-herqE",
  authDomain: "weighttracker-c59df.firebaseapp.com",
  projectId: "weighttracker-c59df",
  storageBucket: "weighttracker-c59df.firebasestorage.app",
  messagingSenderId: "1038763378023",
  appId: "1:1038763378023:web:820edc382b8d4f8a39dbc2"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ─── CONSTANTS + STATE ───────────────────────────────────────────────────────
const PEOPLE = {
  you:   { name: 'Josh',  color: '#86C48A' },
  emily: { name: 'Emily', color: '#F2B33D' }
};
const KEYS = ['you', 'emily'];
const KG_PER_LB = 0.45359237;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const $ = id => document.getElementById(id);

let selectedPerson = LS.get('wt_who') === 'emily' ? 'emily' : 'you';
let unit = 'kg';
let entries = [];
let goals = { you: null, emily: null };   // stored in kg
let range = (() => { const r = LS.get('wt_range'); return r !== null && [0, 4, 12].includes(+r) ? +r : 12; })();
let showAll = false;
let loaded = false;
let chart = null;
let chartDrawn = false;

try { const g = JSON.parse(LS.get('wt_goals') || 'null'); if (g) goals = { you: g.you ?? null, emily: g.emily ?? null }; } catch (e) {}

// ─── DATE HELPERS (weeks run Monday to Sunday) ───────────────────────────────
const pad = n => String(n).padStart(2, '0');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fmtD = ms => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => fmtD(parseD(s) + n * 864e5);
const weekKey = s => { const ms = parseD(s); const dow = (new Date(ms).getUTCDay() + 6) % 7; return fmtD(ms - dow * 864e5); };
const shortDate = s => { const d = new Date(parseD(s)); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const longDate = s => { const d = new Date(parseD(s)); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS_LONG[d.getUTCMonth()]}`; };
const dayShort = s => DAYS[new Date(parseD(s)).getUTCDay()].slice(0, 3);
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const thisWeek = () => weekKey(todayStr());

// ─── WEIGHT HELPERS ──────────────────────────────────────────────────────────
const toKg = e => e.unit === 'lbs' ? e.weight * KG_PER_LB : e.weight;
const kgToUnit = kg => unit === 'kg' ? kg : kg / KG_PER_LB;
const dispW = e => e.unit === unit ? e.weight : +kgToUnit(toKg(e)).toFixed(1);
const num = n => String(+(+n).toFixed(2));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

function personEntries(p) {
  return entries
    .filter(e => e.person === p && e.date && Number.isFinite(e.weight))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.id || 0) - (b.id || 0));
}
function streakOf(list) {
  const set = new Set(list.map(e => weekKey(e.date)));
  let cur = thisWeek();
  if (!set.has(cur)) cur = addDays(cur, -7);
  let n = 0;
  while (set.has(cur)) { n++; cur = addDays(cur, -7); }
  return n;
}
function goalInfo(p, list) {
  const g = goals[p];
  if (g == null || !list.length) return null;
  const start = toKg(list[0]), cur = toKg(list[list.length - 1]);
  const total = Math.abs(start - g);
  const reached = start > g ? cur <= g : start < g ? cur >= g : true;
  let pct;
  if (reached) pct = 100;
  else if (total < 0.05) pct = 0;
  else pct = Math.max(0, Math.min(100, ((start - cur) * Math.sign(start - g)) / total * 100));
  return { pct, reached, remainingKg: reached ? 0 : Math.abs(cur - g) };
}

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
let celTimer;
function showCelebration(title, sub) {
  $('cel-title').textContent = title;
  $('cel-sub').textContent = sub;
  const c = $('celebrate');
  c.classList.add('show');
  clearTimeout(celTimer);
  celTimer = setTimeout(() => c.classList.remove('show'), 5200);
}
function setSyncStatus(msg, cls) {
  const s = $('sync-status');
  s.textContent = msg;
  s.className = 'sync ' + (cls || '');
}
function applyPerson() {
  document.body.dataset.who = selectedPerson === 'emily' ? 'emily' : 'you';
  document.querySelectorAll('.who-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.who === selectedPerson)));
}
function applyUnitUI() {
  $('btn-kg').setAttribute('aria-pressed', String(unit === 'kg'));
  $('btn-lbs').setAttribute('aria-pressed', String(unit === 'lbs'));
  $('weight-suffix').textContent = unit;
  $('edit-unit').textContent = unit;
  $('goal-unit').textContent = unit;
}
function applyRangeUI() {
  document.querySelectorAll('#range button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === range)));
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function setUnit(u) {
  unit = u;
  applyUnitUI();
  setDoc(doc(db, 'settings', 'unit'), { value: u }).catch(() => {});
  render();
}

function milestone(p, before, ne) {
  const name = PEOPLE[p].name;
  const kg = toKg(ne);
  const after = [...before, ne].sort((a, b) => a.date.localeCompare(b.date));
  if (before.length) {
    const goal = goals[p];
    if (goal != null) {
      const startU = kgToUnit(toKg(before[0]));
      const dir = Math.sign(toKg(before[0]) - goal) || 1;
      const goalU = kgToUnit(goal);
      const total = Math.abs(startU - goalU);
      const tw = k => (startU - kgToUnit(k)) * dir;
      const prevBest = Math.max(0, ...before.map(e => tw(toKg(e))));
      const now = tw(kg);
      if (now >= total && prevBest < total) return { title: `Goal reached, ${name}!`, sub: `${num(goalU)} ${unit}. Brilliant.` };
      const a = Math.floor(now + 1e-9), b = Math.floor(prevBest + 1e-9);
      if (a > b && a >= 1) return { title: `${a} ${unit} closer to your goal`, sub: `${num(Math.max(0, total - now))} ${unit} to go, ${name}.` };
    } else if (kg < Math.min(...before.map(toKg)) - 0.005) {
      return { title: `New low, ${name}`, sub: 'Lightest weigh-in so far.' };
    }
  }
  const s = streakOf(after), sb = streakOf(before);
  if (s > sb && s % 4 === 0) return { title: `${s} weeks in a row`, sub: `${name} hasn't missed a week.` };
  return null;
}

async function logWeight() {
  const w = parseFloat($('weight-input').value);
  const d = $('date-input').value;
  const note = $('note-input').value.trim();
  if (!w || w <= 0) { showToast('Enter a valid weight'); return; }
  if (!d) { showToast('Pick a date'); return; }
  if ((unit === 'kg' && (w < 25 || w > 350)) || (unit === 'lbs' && (w < 55 || w > 770))) {
    showToast(`That looks off. Check the number and unit`); return;
  }
  const btn = $('log-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const before = personEntries(selectedPerson);
  try {
    const data = { person: selectedPerson, weight: w, unit, date: d, id: Date.now() };
    if (note) data.note = note;
    await addDoc(collection(db, 'entries'), data);
    $('weight-input').value = '';
    $('note-input').value = '';
    $('note-input').hidden = true;
    $('note-toggle').hidden = false;
    const m = milestone(selectedPerson, before, { weight: w, unit, date: d });
    if (m) showCelebration(m.title, m.sub); else showToast(`Logged for ${PEOPLE[selectedPerson].name}`);
  } catch (e) {
    showToast('Error saving. Check your connection');
    setSyncStatus('Save failed', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Log weight';
}

// Edit entry
let editing = null;
let delTimer;
function resetDel() {
  clearTimeout(delTimer);
  const b = $('edit-del');
  b.classList.remove('confirm');
  b.textContent = 'Delete entry';
}
function openEdit(docId) {
  const e = entries.find(x => x.docId === docId);
  if (!e) return;
  editing = e;
  $('edit-title').textContent = `${PEOPLE[e.person] ? PEOPLE[e.person].name : 'Entry'}, ${shortDate(e.date)}`;
  $('edit-date').value = e.date;
  $('edit-weight').value = num(dispW(e));
  $('edit-note').value = e.note || '';
  applyUnitUI();
  resetDel();
  $('edit-dlg').showModal();
}
async function saveEdit() {
  if (!editing) return;
  const w = parseFloat($('edit-weight').value);
  const d = $('edit-date').value;
  if (!w || w <= 0 || !d) { showToast('Check the date and weight'); return; }
  const data = { date: d, note: $('edit-note').value.trim() };
  if (num(w) !== num(dispW(editing))) { data.weight = w; data.unit = unit; }
  try {
    await updateDoc(doc(db, 'entries', editing.docId), data);
    $('edit-dlg').close();
    showToast('Entry updated');
  } catch (e) { showToast('Error saving changes'); }
}
async function deleteEdit() {
  if (!editing) return;
  const b = $('edit-del');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm');
    b.textContent = 'Tap again to delete';
    clearTimeout(delTimer);
    delTimer = setTimeout(resetDel, 3500);
    return;
  }
  try {
    await deleteDoc(doc(db, 'entries', editing.docId));
    $('edit-dlg').close();
    showToast('Entry deleted');
  } catch (e) { showToast('Error deleting entry'); }
}

// Goals
let goalFor = null;
function openGoal(p) {
  goalFor = p;
  $('goal-title').textContent = `Goal weight for ${PEOPLE[p].name}`;
  $('goal-input').value = goals[p] != null ? num(kgToUnit(goals[p])) : '';
  applyUnitUI();
  $('goal-dlg').showModal();
}
function persistGoals() {
  LS.set('wt_goals', JSON.stringify(goals));
  setDoc(doc(db, 'settings', 'goals'), { you: goals.you ?? null, emily: goals.emily ?? null })
    .catch(() => showToast('Goal saved on this phone only'));
}
function saveGoal(clear) {
  if (!goalFor) return;
  if (clear) goals[goalFor] = null;
  else {
    const v = parseFloat($('goal-input').value);
    if (!v || v <= 0) { showToast('Enter a goal weight'); return; }
    goals[goalFor] = unit === 'kg' ? v : v * KG_PER_LB;
  }
  persistGoals();
  $('goal-dlg').close();
  render();
}

// Discord summary
function buildSummary() {
  const lines = [`**Weigh-in, week of ${shortDate(thisWeek())}**`];
  KEYS.forEach(p => {
    const l = personEntries(p);
    if (!l.length) return;
    const last = l[l.length - 1];
    let s = `**${PEOPLE[p].name}** ${num(dispW(last))} ${unit}`;
    if (l.length > 1) {
      const d = +(dispW(last) - dispW(l[l.length - 2])).toFixed(2);
      s += d === 0 ? ' (no change)' : ` (${d > 0 ? 'up' : 'down'} ${num(Math.abs(d))})`;
    }
    if (weekKey(last.date) !== thisWeek()) s += ` on ${shortDate(last.date)}`;
    const gi = goalInfo(p, l);
    if (gi) s += gi.reached ? ', goal reached' : `, ${num(kgToUnit(gi.remainingKg))} ${unit} to goal`;
    const st = streakOf(l);
    if (st >= 2) s += `, ${st}-week streak`;
    lines.push(s);
  });
  lines.push(location.origin + location.pathname);
  return lines.join('\n');
}
async function copySummary() {
  const text = buildSummary();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  showToast('Copied. Paste it in Discord');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  renderHero();
  renderStats();
  renderChart();
  renderHistory();
}

function renderHero() {
  const line = $('hero-line'), chips = $('chips');
  if (!loaded) { line.textContent = longDate(todayStr()); chips.innerHTML = ''; return; }
  const isMonday = new Date(parseD(todayStr())).getUTCDay() === 1;
  const wk = thisWeek();
  const status = KEYS.map(p => ({ p, done: personEntries(p).some(e => weekKey(e.date) === wk) }));
  const all = status.every(s => s.done);
  line.textContent = all ? 'Both logged this week' : isMonday ? 'Weigh-in day' : `Next weigh-in Monday ${shortDate(addDays(wk, 7))}`;
  chips.innerHTML = status.map(s => {
    const P = PEOPLE[s.p];
    const txt = s.done ? `${P.name} logged` : isMonday ? `${P.name} due today` : `${P.name} not logged yet`;
    return `<span class="chip ${s.done ? 'done' : 'wait'}" style="--c:${P.color}"><i class="ring"></i>${txt}</span>`;
  }).join('');
}

function personCard(p) {
  const P = PEOPLE[p], list = personEntries(p);
  const st = streakOf(list);
  const head = `<header class="ph"><span class="dot" style="background:${P.color}"></span><h3>${P.name}</h3>${st >= 1 ? `<span class="streak">${st}-week streak</span>` : ''}</header>`;
  if (!list.length) return `<article class="pcard" style="--pc:${P.color}">${head}<p class="none">No weigh-ins yet. Log the first one above.</p></article>`;

  const first = list[0], last = list[list.length - 1];
  let delta = 'First check-in';
  if (list.length > 1) {
    const d = +(dispW(last) - dispW(list[list.length - 2])).toFixed(2);
    delta = d === 0 ? 'No change since last check-in' : `${d > 0 ? '▲' : '▼'} ${num(Math.abs(d))} ${unit} since last check-in`;
  }
  const lowest = Math.min(...list.map(dispW));
  const gi = goalInfo(p, list);
  const goalHtml = gi
    ? `<div class="goal"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(gi.pct)}" aria-label="Progress to goal"><i style="width:${gi.pct}%"></i></div>
       <div class="goal-row"><span><b>${gi.reached ? 'Goal reached' : `${num(kgToUnit(gi.remainingKg))} ${unit} to go`}</b></span><button type="button" class="linkbtn" data-goal="${p}">Goal ${num(kgToUnit(goals[p]))} ${unit}</button></div></div>`
    : `<div class="goal"><button type="button" class="linkbtn" data-goal="${p}">Set a goal weight</button></div>`;

  return `<article class="pcard" style="--pc:${P.color}">${head}
    <div class="big">${num(dispW(last))}<small>${unit}</small></div>
    <p class="delta">${delta}</p>
    ${goalHtml}
    <dl class="mini">
      <div><dt>Started at</dt><dd>${num(dispW(first))}</dd></div>
      <div><dt>Lowest</dt><dd>${num(lowest)}</dd></div>
      <div><dt>Check-ins</dt><dd>${list.length}</dd></div>
    </dl></article>`;
}

function renderStats() {
  const el = $('stats');
  if (!loaded) { el.innerHTML = '<p class="empty">Loading your weigh-ins…</p>'; return; }
  if (!entries.length) { el.innerHTML = '<p class="empty">Log your first weigh-in to see your progress here.</p>'; return; }
  el.innerHTML = KEYS.map(personCard).join('');
}

function renderChart() {
  const has = loaded && entries.length > 0;
  $('chart-empty').hidden = has || !loaded;
  $('chart-wrap').hidden = !has;
  if (!has) { if (chart) { chart.destroy(); chart = null; } return; }
  if (typeof Chart === 'undefined') return;

  const lists = { you: personEntries('you'), emily: personEntries('emily') };
  const wkAll = entries.filter(e => e.date).map(e => weekKey(e.date)).sort();
  const earliest = wkAll[0];
  const latest = wkAll[wkAll.length - 1] > thisWeek() ? wkAll[wkAll.length - 1] : thisWeek();
  let startWk = earliest;
  if (range > 0) { const w = addDays(latest, -7 * (range - 1)); if (w > earliest) startWk = w; }
  const wks = [], labels = [];
  for (let w = startWk; w <= latest; w = addDays(w, 7)) { wks.push(w); labels.push(shortDate(w)); }

  function series(p) {
    const byWeek = new Map();
    lists[p].forEach(e => byWeek.set(weekKey(e.date), dispW(e)));
    const seq = [...byWeek.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const trend = new Map();
    seq.forEach(([wk], i) => {
      const win = seq.slice(Math.max(0, i - 2), i + 1).map(x => x[1]);
      trend.set(wk, +(win.reduce((a, b) => a + b, 0) / win.length).toFixed(2));
    });
    return { raw: wks.map(w => byWeek.has(w) ? byWeek.get(w) : null), trend: wks.map(w => trend.has(w) ? trend.get(w) : null) };
  }

  const datasets = [];
  const vals = [];
  KEYS.forEach(p => {
    const P = PEOPLE[p], s = series(p);
    if (!s.raw.some(v => v !== null)) return;
    s.raw.forEach(v => { if (v !== null) vals.push(v); });
    datasets.push({
      label: P.name, data: s.raw, showLine: false, order: 0,
      pointRadius: 4.5, pointHoverRadius: 7, pointBackgroundColor: rgba(P.color, .9),
      pointBorderColor: '#111C16', pointBorderWidth: 2
    });
    datasets.push({
      label: `${P.name} trend`, data: s.trend, order: 1, spanGaps: true, tension: 0.35, fill: true,
      borderColor: P.color, borderWidth: 3, pointRadius: 0, pointHoverRadius: 0,
      backgroundColor: c => {
        const a = c.chart.chartArea;
        if (!a) return 'transparent';
        const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
        g.addColorStop(0, rgba(P.color, .16)); g.addColorStop(1, rgba(P.color, 0));
        return g;
      }
    });
    if (goals[p] != null) {
      const gv = +kgToUnit(goals[p]).toFixed(2);
      vals.push(gv);
      datasets.push({
        label: `${P.name} goal`, data: wks.map(() => gv), _goal: true, order: 2,
        borderColor: rgba(P.color, .6), borderWidth: 1.5, borderDash: [6, 6], pointRadius: 0, pointHoverRadius: 0, fill: false
      });
    }
  });

  const yPad = unit === 'kg' ? 0.5 : 1;
  const yMin = vals.length ? Math.floor(Math.min(...vals) - yPad) : undefined;
  const yMax = vals.length ? Math.ceil(Math.max(...vals) + yPad) : undefined;
  const tickColor = '#9AA79B';

  if (chart) chart.destroy();
  chart = new Chart($('weightChart').getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: chartDrawn ? false : { duration: 900 },
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 6, right: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#EDE7D3', titleColor: '#0A120E', bodyColor: '#0A120E',
          titleFont: { family: 'Hanken Grotesk', size: 12, weight: '600' }, bodyFont: { family: 'Hanken Grotesk', size: 13 },
          padding: 10, cornerRadius: 12, boxPadding: 4,
          filter: item => !item.dataset._goal && item.parsed.y !== null,
          callbacks: {
            title: items => `Week of ${items[0].label}`,
            label: c => ` ${c.dataset.label}: ${num(c.parsed.y)} ${unit}`
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { color: tickColor, font: { family: 'Hanken Grotesk', size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
        y: { min: yMin, max: yMax, grid: { color: 'rgba(237,231,211,.07)' }, border: { display: false }, ticks: { color: tickColor, font: { family: 'Hanken Grotesk', size: 11 }, maxTicksLimit: 6, callback: v => num(v) } }
      }
    }
  });
  chartDrawn = true;
}

function renderHistory() {
  const rowsEl = $('hist-rows'), toggle = $('hist-toggle'), head = $('hist-head');
  const valid = entries.filter(e => e.date && Number.isFinite(e.weight));
  if (!loaded || !valid.length) {
    head.hidden = true; toggle.hidden = true;
    rowsEl.innerHTML = `<p class="empty">${loaded ? 'No entries yet. Weigh-ins will show up here, week by week.' : 'Loading…'}</p>`;
    return;
  }
  head.hidden = false;
  const lists = { you: personEntries('you'), emily: personEntries('emily') };
  const deltas = {};
  const firstWk = {};
  KEYS.forEach(p => {
    lists[p].forEach((e, i) => { if (i > 0) deltas[e.docId] = +(dispW(e) - dispW(lists[p][i - 1])).toFixed(2); });
    firstWk[p] = lists[p].length ? weekKey(lists[p][0].date) : null;
  });

  const wkAll = valid.map(e => weekKey(e.date)).sort();
  const earliest = wkAll[0];
  const latest = wkAll[wkAll.length - 1] > thisWeek() ? wkAll[wkAll.length - 1] : thisWeek();
  const weeks = [];
  for (let w = latest; w >= earliest; w = addDays(w, -7)) weeks.push(w);
  const visible = showAll ? weeks : weeks.slice(0, 5);

  function cell(p, wk) {
    const inWeek = lists[p].filter(e => weekKey(e.date) === wk);
    if (!inWeek.length) {
      if (wk === thisWeek()) return '<span class="gap">Due</span>';
      if (firstWk[p] && wk > firstWk[p]) return '<span class="gap miss">Missed</span>';
      return '<span class="gap">-</span>';
    }
    return inWeek.map(e => {
      const d = deltas[e.docId];
      const bits = [];
      if (e.date !== wk) bits.push(dayShort(e.date));
      if (d !== undefined) bits.push(d === 0 ? 'no change' : `${d > 0 ? '+' : '−'}${num(Math.abs(d))}`);
      return `<button type="button" class="cell" data-doc="${esc(e.docId)}" aria-label="Edit ${PEOPLE[p].name}, ${shortDate(e.date)}, ${num(dispW(e))} ${unit}">
        <span class="w">${num(dispW(e))}<small>${unit}</small></span>
        ${bits.length ? `<span class="d">${bits.join(', ')}</span>` : ''}
        ${e.note ? `<span class="n">${esc(e.note)}</span>` : ''}
      </button>`;
    }).join('');
  }

  rowsEl.innerHTML = visible.map(wk => `<div class="hrow"><div class="wk">${shortDate(wk)}</div><div>${cell('you', wk)}</div><div>${cell('emily', wk)}</div></div>`).join('');
  toggle.hidden = weeks.length <= 5;
  toggle.textContent = showAll ? 'Show fewer' : `Show all ${weeks.length} weeks`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.who-btn').forEach(b => b.addEventListener('click', () => {
  selectedPerson = b.dataset.who;
  LS.set('wt_who', selectedPerson);
  applyPerson();
}));
$('btn-kg').addEventListener('click', () => setUnit('kg'));
$('btn-lbs').addEventListener('click', () => setUnit('lbs'));
$('note-toggle').addEventListener('click', () => { $('note-input').hidden = false; $('note-toggle').hidden = true; $('note-input').focus(); });
$('log-btn').addEventListener('click', logWeight);
$('weight-input').addEventListener('keydown', e => { if (e.key === 'Enter') logWeight(); });
$('share-btn').addEventListener('click', copySummary);
document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => {
  range = +b.dataset.r; LS.set('wt_range', String(range)); applyRangeUI(); renderChart();
}));
$('hist-toggle').addEventListener('click', () => { showAll = !showAll; renderHistory(); });
$('hist-rows').addEventListener('click', e => { const c = e.target.closest('[data-doc]'); if (c) openEdit(c.dataset.doc); });
$('stats').addEventListener('click', e => { const g = e.target.closest('[data-goal]'); if (g) openGoal(g.dataset.goal); });

$('edit-save').addEventListener('click', saveEdit);
$('edit-del').addEventListener('click', deleteEdit);
$('edit-cancel').addEventListener('click', () => $('edit-dlg').close());
$('edit-dlg').addEventListener('close', resetDel);
$('goal-save').addEventListener('click', () => saveGoal(false));
$('goal-clear').addEventListener('click', () => saveGoal(true));
$('goal-cancel').addEventListener('click', () => $('goal-dlg').close());
['edit-dlg', 'goal-dlg'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).close(); }));
$('celebrate').addEventListener('click', () => $('celebrate').classList.remove('show'));

// ─── INIT ────────────────────────────────────────────────────────────────────
$('date-input').value = todayStr();
applyPerson(); applyUnitUI(); applyRangeUI();
render();

// Real-time entries
const q = query(collection(db, 'entries'), orderBy('date', 'asc'));
onSnapshot(q, snapshot => {
  entries = snapshot.docs.map(d => {
    const x = d.data();
    return { ...x, weight: parseFloat(x.weight), docId: d.id };
  });
  loaded = true;
  setSyncStatus('● Live', 'live');
  render();
}, () => {
  setSyncStatus('Connection error', 'error');
});

// Saved unit preference (same as before)
getDoc(doc(db, 'settings', 'unit')).then(d => {
  if (d.exists()) {
    const u = d.data().value;
    if (u === 'kg' || u === 'lbs') { unit = u; applyUnitUI(); render(); }
  }
}).catch(() => {});

// Goals, shared live between your phones (falls back to this phone if not allowed)
onSnapshot(doc(db, 'settings', 'goals'), snap => {
  if (snap.exists()) {
    const g = snap.data();
    goals = { you: g.you ?? null, emily: g.emily ?? null };
    LS.set('wt_goals', JSON.stringify(goals));
    render();
  }
}, () => {});
</script>
